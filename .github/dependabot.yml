# Workflow actions are pinned to commit SHAs and Node base images to digests;
# Dependabot keeps both current. npm and Python dependencies are upgraded by
# hand through pnpm-lock.yaml and worker/requirements*.lock.txt.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ['*']

  - package-ecosystem: docker
    directories: [/worker]
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      # Node majors move deliberately with .nvmrc and CI (currently 24).
      - dependency-name: node
        update-types: ['version-update:semver-major']
    groups:
      node-images:
        patterns: ['*']
