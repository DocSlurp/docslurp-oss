name: Worker Images

# Publishes the worker images that remote parser sandboxes (for example the
# Modal provider's default ghcr.io/docslurp/worker-full:<version>) pull.
# Runs only on release tags and manual dispatch.
#
# Supply chain: each image is pushed with BuildKit max-mode SLSA provenance and
# an SPDX SBOM attached to its image index, then (in a separate job that alone
# holds id-token: write) signed keylessly with cosign and given a GitHub build
# provenance attestation, both bound to the pushed digest. Pin consumers to
# that digest and verify it (docs/self-host/security.md#verifying-worker-images).
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Image version tag without the leading v (for example 1.2.3)'
        required: true
        type: string

concurrency:
  group: worker-images-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    timeout-minutes: 60
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - profile: lean
            dockerfile: worker/Dockerfile.lean
          - profile: full
            dockerfile: worker/Dockerfile.full
    steps:
      - name: Resolve image version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "${REF_TYPE}" = "tag" ]; then
            version="${REF_NAME#v}"
          else
            version="${INPUT_VERSION#v}"
          fi
          if ! printf '%s' "${version}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$'; then
            echo "Invalid image version: ${version}" >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Reserve disk space for worker image build
        run: |
          # These hosted-runner SDKs are unused by this Node/Python worker.
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet
          available_bytes="$(df -B1 --output=avail / | tail -n 1 | tr -d ' ')"
          echo "Available image-build bytes: ${available_bytes}"
          if [ "${available_bytes}" -lt 21474836480 ]; then
            echo "Worker image build requires at least 20 GiB of free runner disk." >&2
            exit 1
          fi

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The lockfiles are compiled for x86_64 Linux, so images are linux/amd64 only.
      - name: Build and push worker-${{ matrix.profile }}
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          # SLSA provenance (max: build args, sources, materials) and an SPDX SBOM,
          # stored as attestation manifests in the pushed image index.
          provenance: mode=max
          sbom: true
          # Baked into the image as DOCSLURP_VERSION; the Modal provider's default image tag.
          build-args: |
            DOCSLURP_VERSION=${{ steps.version.outputs.version }}
          tags: |
            ghcr.io/docslurp/worker-${{ matrix.profile }}:${{ steps.version.outputs.version }}
            ghcr.io/docslurp/worker-${{ matrix.profile }}:${{ github.sha }}

      - name: Record pushed digest
        id: pushed
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          PROFILE: ${{ matrix.profile }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if ! printf '%s' "${DIGEST}" | grep -Eq '^sha256:[0-9a-f]{64}$'; then
            echo "build-push-action returned no image digest: '${DIGEST}'" >&2
            exit 1
          fi
          image="ghcr.io/docslurp/worker-${PROFILE}"
          echo "image=${image}@${DIGEST}" >> "$GITHUB_OUTPUT"
          mkdir -p "${RUNNER_TEMP}/digest"
          printf '%s\n' "${DIGEST}" > "${RUNNER_TEMP}/digest/${PROFILE}"
          {
            echo "### worker-${PROFILE} ${VERSION}"
            echo
            echo "Pushed \`${image}@${DIGEST}\`"
            echo "(tags \`${VERSION}\`, \`${GITHUB_SHA}\`)."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload pushed digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: worker-image-digest-${{ matrix.profile }}
          path: ${{ runner.temp }}/digest/${{ matrix.profile }}
          retention-days: 7
          if-no-files-found: error

  # Signing is isolated from the build: only this job can mint an OIDC token,
  # and it never runs Dockerfile or package-manager code.
  sign:
    needs: publish
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write # push the cosign signature and attestation to GHCR
      id-token: write # keyless signing certificate from Fulcio / GitHub attestations
      attestations: write
    strategy:
      fail-fast: true
      matrix:
        profile: [lean, full]
    env:
      IMAGE: ghcr.io/docslurp/worker-${{ matrix.profile }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: worker-image-digest-${{ matrix.profile }}
          path: ${{ runner.temp }}/digest

      - name: Read pushed digest
        id: digest
        env:
          PROFILE: ${{ matrix.profile }}
        run: |
          digest="$(tr -d '[:space:]' < "${RUNNER_TEMP}/digest/${PROFILE}")"
          if ! printf '%s' "${digest}" | grep -Eq '^sha256:[0-9a-f]{64}$'; then
            echo "Invalid digest for ${PROFILE}: '${digest}'" >&2
            exit 1
          fi
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Keyless: the Fulcio certificate names this workflow file and ref, and the
      # signature is logged in Rekor. Signs the digest, never a mutable tag.
      - name: Sign worker-${{ matrix.profile }}
        env:
          DIGEST: ${{ steps.digest.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Attest build provenance for worker-${{ matrix.profile }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          push-to-registry: true

      - name: Verify the published signature
        env:
          DIGEST: ${{ steps.digest.outputs.digest }}
          IDENTITY: ${{ github.server_url }}/${{ github.workflow_ref }}
        run: |
          cosign verify "${IMAGE}@${DIGEST}" \
            --certificate-identity "${IDENTITY}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null
          {
            echo "### Signed ${IMAGE}"
            echo
            echo "\`${IMAGE}@${DIGEST}\`"
            echo
            echo '```sh'
            echo "cosign verify ${IMAGE}@${DIGEST} \\"
            echo "  --certificate-identity-regexp '^https://github\\.com/DocSlurp/docslurp-oss/\\.github/workflows/worker-images\\.yml@refs/(tags/v[0-9].*|heads/main)\$' \\"
            echo "  --certificate-oidc-issuer https://token.actions.githubusercontent.com"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
