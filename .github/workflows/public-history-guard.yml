name: Public history guard

# This repository is public. Any branch whose history carries the private pre-split DocSlurp/app history
# (a foreign root commit, or private-only paths such as app/, api/, docs/business/) is deleted on push and
# fails on pull requests. See scripts/check-public-history.sh.
on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: write

jobs:
  guard:
    name: no private history
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Check history
        id: check
        run: scripts/check-public-history.sh HEAD origin/main
      - name: Delete the offending branch
        if: failure() && github.event_name == 'push' && github.ref != 'refs/heads/main'
        run: git push origin --delete "${GITHUB_REF#refs/heads/}"
