name: Worker Supply Chain

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/worker-supply-chain.yml'
      - 'worker/requirements*.txt'
      - 'worker/Dockerfile*'
      - 'scripts/setup-worker-python-venv.sh'
      - 'scripts/start-worker.sh'
      - 'scripts/setup-cli-*.sh'
      - 'scripts/check-worker-prerequisites*'
      - 'scripts/normalize-sbom-sarif*'
      - 'worker/package.json'
      - 'worker/vendor-bundles.json'
      - 'scripts/build-worker-venv.sh'
      - 'scripts/prune-worker-node-modules.mjs'
      - 'scripts/vendor-bundles/**'
      - 'scripts/uv-installer*.txt'
      - 'scripts/check-python-lock-hashes*'
      - '.grype.yaml'
      - 'pnpm-lock.yaml'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/worker-supply-chain.yml'
      - 'worker/requirements*.txt'
      - 'worker/Dockerfile*'
      - 'scripts/setup-worker-python-venv.sh'
      - 'scripts/start-worker.sh'
      - 'scripts/setup-cli-*.sh'
      - 'scripts/check-worker-prerequisites*'
      - 'scripts/normalize-sbom-sarif*'
      - 'worker/package.json'
      - 'worker/vendor-bundles.json'
      - 'scripts/build-worker-venv.sh'
      - 'scripts/prune-worker-node-modules.mjs'
      - 'scripts/vendor-bundles/**'
      - 'scripts/uv-installer*.txt'
      - 'scripts/check-python-lock-hashes*'
      - '.grype.yaml'
      - 'pnpm-lock.yaml'
  workflow_dispatch:

concurrency:
  group: worker-supply-chain-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lockfiles-and-image:
    timeout-minutes: 35
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Build all profiles on one runner: reuse Docker layers and clean disk once.
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: '3.11'
          version: '0.13.0'

      # Every install path runs pip/uv with --require-hashes, so the locks must
      # carry a sha256 for every artifact (uv pip compile --generate-hashes).
      - name: Rebuild tracked worker lockfiles
        run: |
          UV_TORCH_BACKEND=cpu uv pip compile worker/requirements-base.txt --generate-hashes --python-version 3.11 --python-platform x86_64-unknown-linux-gnu --output-file worker/requirements-base.lock.txt
          UV_TORCH_BACKEND=cpu uv pip compile worker/requirements.txt --generate-hashes --python-version 3.11 --python-platform x86_64-unknown-linux-gnu --output-file worker/requirements.lock.txt
          UV_TORCH_BACKEND=cpu uv pip compile worker/requirements-fallback.txt --generate-hashes --python-version 3.11 --python-platform x86_64-unknown-linux-gnu --output-file worker/requirements-fallback.lock.txt
          uv pip compile scripts/uv-installer.txt --generate-hashes --universal --python-version 3.11 --output-file scripts/uv-installer.lock.txt

      - name: Ensure worker lockfiles are committed
        run: git diff --exit-code -- worker/requirements-base.lock.txt worker/requirements.lock.txt worker/requirements-fallback.lock.txt scripts/uv-installer.lock.txt

      - name: Ensure every Python lock pins hashes
        run: node scripts/check-python-lock-hashes.mjs

      - name: Reserve disk space for worker image build
        run: |
          # These hosted-runner SDKs are unused by this Node/Python worker.
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet
          available_bytes="$(df -B1 --output=avail / | tail -n 1 | tr -d ' ')"
          echo "Available image-build bytes: ${available_bytes}"
          if [ "${available_bytes}" -lt 21474836480 ]; then
            echo "Worker image build requires at least 20 GiB of free runner disk." >&2
            exit 1
          fi

      # Fly rejects images over ~8 GB uncompressed; the worker's models, vendor
      # bundles and scratch files share a separate ~7.8 GB writable layer
      # (docs/worker-image.md). The production (lean) image keeps a tight budget.
      - name: Build and verify every worker image
        shell: bash # Includes pipefail: tee must not hide a failed Docker build.
        run: |
          # All profiles share their TypeScript builder. Keep that cache local
          # to this disposable runner; do not upload multi-GB Docker caches.
          for profile in full default lean; do
            dockerfile="worker/Dockerfile.$profile"
            if [ "$profile" = default ]; then dockerfile=worker/Dockerfile; fi
            image="docslurp-worker:ci-$profile"
            echo "::group::Build and verify $profile"
            # Retry a transport failure once on this runner, preserving completed
            # layers. Compiler errors and image assertions still fail immediately.
            build_log="$RUNNER_TEMP/worker-build-$profile.log"
            for attempt in 1 2; do
              if docker build -f "$dockerfile" -t "$image" . 2>&1 | tee "$build_log"; then
                break
              fi
              if [ "$attempt" = 2 ] || ! grep -qE 'ECONNRESET|ETIMEDOUT|EAI_AGAIN|TLS handshake timeout' "$build_log"; then
                exit 1
              fi
              echo "::warning::Transient download failure building $profile; retrying once with local layers."
            done
            max_image_bytes=6442450944
            if [ "$profile" = lean ]; then max_image_bytes=2684354560; fi
            image_bytes="$(docker image inspect "$image" --format '{{.Size}}')"
            echo "Worker $profile image bytes: ${image_bytes}; limit: ${max_image_bytes}"
            test "${image_bytes}" -le "${max_image_bytes}"
            docker history --format '{{.Size}}\t{{.CreatedBy}}' "$image" | head -25
            if [ "$profile" = lean ]; then
              docker run --rm --entrypoint node "$image" scripts/check-worker-prerequisites.mjs --profile=lean
              # Runtime pip installs stay off, the venv and app are not writable by the worker user,
              # the vendor bundle cache is, and no pnpm store or build toolchain ships.
              docker run --rm --entrypoint bash "$image" -c '
                set -e
                test "$DOCSLURP_PYTHON_LAZY_INSTALL" = false
                test "$(id -u)" = 10001
                ! touch /app/.venv/probe 2>/dev/null && ! touch /app/worker/probe 2>/dev/null
                touch "$DOCSLURP_VENDOR_BUNDLE_DIR/probe" && rm "$DOCSLURP_VENDOR_BUNDLE_DIR/probe"
                test ! -e /root/.local/share/pnpm && test ! -e /app/node_modules/.pnpm
                ! command -v pnpm && ! test -x /app/.venv/bin/pip
                node -e "JSON.parse(require(\"fs\").readFileSync(\"/app/worker/vendor-bundles.json\",\"utf8\"))"'
            else
              docker run --rm --entrypoint node "$image" scripts/check-worker-prerequisites.mjs --profile=full
              docker run --rm --entrypoint /app/.venv/bin/python "$image" -c "import importlib.util; names = ['torch', 'chromadb', 'lancedb', 'pymilvus']; baked = [name for name in names if importlib.util.find_spec(name) is not None]; assert not baked, f'Optional stacks must be installed at startup: {baked}'"
            fi
            echo "::endgroup::"
          done

      - name: Generate worker source SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: spdx-json
          output-file: worker-source-sbom.spdx.json
          artifact-name: worker-source-sbom.spdx.json

      # Fails on critical findings. Not-applicable findings are ignored only in
      # .grype.yaml, per advisory and pinned package version, with a reason.
      - name: Scan worker source SBOM
        id: worker-source-sbom-scan
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          sbom: worker-source-sbom.spdx.json
          config: .grype.yaml
          fail-build: true
          output-format: sarif
          severity-cutoff: critical

      - name: Retain worker vulnerability report
        if: always() && steps.worker-source-sbom-scan.outputs.sarif != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: worker-vulnerability-report.sarif
          path: ${{ steps.worker-source-sbom-scan.outputs.sarif }}
          retention-days: 7
          if-no-files-found: error

      - name: Prepare SARIF locations for GitHub
        if: always() && steps.worker-source-sbom-scan.outputs.sarif != ''
        env:
          SCAN_SARIF: ${{ steps.worker-source-sbom-scan.outputs.sarif }}
        run: node scripts/normalize-sbom-sarif.mjs "$SCAN_SARIF" worker-github.sarif worker-source-sbom.spdx.json

      - name: Upload worker scan SARIF
        if: always() && steps.worker-source-sbom-scan.outputs.sarif != ''
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: worker-github.sarif
