name: Python Tooling Compatibility

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/python-tooling.yml'
      - 'worker/requirements*.txt'
      - 'worker/scripts/*.py'
      - 'scripts/check-python-dependencies.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-tooling-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_TORCH_BACKEND: cpu
  HF_HUB_OFFLINE: '1'
  TRANSFORMERS_OFFLINE: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  DO_NOT_TRACK: '1'
  ANONYMIZED_TELEMETRY: 'False'

jobs:
  parsers:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: '3.11'
          version: '0.13.0'
      - run: uv venv
      # The full worker lock (base parsers, unstructured, sentence-transformers,
      # CPU torch), hash-checked like every other worker install path.
      - name: Install supported parser stack with CPU wheels
        run: uv pip install --require-hashes -r worker/requirements.lock.txt
      - name: Exercise PDF and HTML adapters without downloading models
        run: uv run --no-project scripts/check-python-dependencies.py --optional

      - name: Verify bounded Doppler chunk planning and merge
        run: uv run --no-project python worker/scripts/test_doppler_vm.py
