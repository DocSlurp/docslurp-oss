name: Secret scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: gitleaks and trufflehog (verified only)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Pinned release binaries, sha256-verified (no third-party actions, no licence keys).
      - name: Install scanners
        run: scripts/install-scanners.sh "$RUNNER_TEMP/bin"
      - name: gitleaks (working tree and history)
        run: |
          "$RUNNER_TEMP/bin/gitleaks" detect --source . --redact --no-banner --exit-code 1
      - name: trufflehog (verified findings only)
        run: |
          "$RUNNER_TEMP/bin/trufflehog" git "file://$GITHUB_WORKSPACE" --results=verified --fail --no-update --github-actions
