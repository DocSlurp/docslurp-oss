name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Public CI: no deploys, no hosted evals, no paid provider keys, no secrets.
jobs:
  # `pnpm test` runs worker then server serially (pnpm -r follows the dependency
  # graph). Split them across runners and shard the worker suite so the slowest
  # lane, not the sum of every suite, sets the wall-clock time.
  test:
    name: ${{ matrix.suite }}
    timeout-minutes: 20
    # Native Kreuzberg requires newer glibc; enable unprivileged namespaces only
    # on this disposable CI runner so the real parser sandbox remains exercised.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: true
      matrix:
        include:
          - suite: typecheck and build
          - suite: worker 1/2
            run: pnpm --filter @docslurp/worker test --shard=1/2
            worker-tools: true
          - suite: worker 2/2
            run: pnpm --filter @docslurp/worker test --shard=2/2
            worker-tools: true
          - suite: server
            run: pnpm --filter @docslurp/server test
          - suite: packages and scripts
            run: pnpm test:packages
    env:
      UV_NO_CACHE: '0'
      PYTHON_VENV: ${{ github.workspace }}/.venv
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        if: matrix.worker-tools
        with:
          python-version: '3.11'
          enable-cache: true
          cache-dependency-glob: worker/requirements-base.lock.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Install worker test tools
        if: matrix.worker-tools
        timeout-minutes: 12
        run: |
          node --test scripts/install-worker-test-tools.test.mjs
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          bash scripts/install-worker-test-tools.sh
      - name: Set up worker Python test dependencies
        if: matrix.worker-tools
        run: |
          DOCSLURP_WORKER_VENV="${PYTHON_VENV}" \
          DOCSLURP_WORKER_REQUIREMENTS_MODE=locked \
          DOCSLURP_WORKER_REQUIREMENTS_FILE=worker/requirements-base.lock.txt \
          DOCSLURP_WORKER_FALLBACK_REQUIREMENTS_FILE=worker/requirements-base.lock.txt \
          DOCSLURP_WORKER_SKIP_FALLBACK=1 \
          bash scripts/setup-worker-python-venv.sh
      - name: Build worker sandbox probe
        if: matrix.worker-tools
        run: pnpm --filter @docslurp/worker build
      - name: Verify worker test prerequisites
        if: matrix.worker-tools
        run: pnpm worker:check --profile=test --sandbox
      - run: ${{ matrix.run }}
        if: matrix.run
      # Deterministic, local-only routing regression gate: no hosted AI calls, no spend.
      - name: Document routing regression eval
        if: matrix.suite == 'worker 1/2'
        run: pnpm eval:routing

      - name: Check migrations are expand/contract safe
        if: matrix.suite == 'typecheck and build'
        run: node scripts/check-migration-safety.mjs
      - name: Check doc links
        if: matrix.suite == 'typecheck and build'
        run: node scripts/check-docs-links.mjs
      - name: Prepare Mermaid renderer
        if: matrix.suite == 'typecheck and build'
        timeout-minutes: 5
        run: |
          mermaid_version=$(node --input-type=module -e 'import { MERMAID_CLI_VERSION } from "./scripts/check-docs-mermaid.mjs"; console.log(MERMAID_CLI_VERSION)')
          npx --yes "@mermaid-js/mermaid-cli@$mermaid_version" --version
        env:
          PUPPETEER_SKIP_DOWNLOAD: "1"
      - name: Check Mermaid diagrams
        if: matrix.suite == 'typecheck and build'
        run: node scripts/check-docs-mermaid.mjs
        env:
          # Use the runner's Chrome instead of downloading one through npx.
          PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome
          PUPPETEER_SKIP_DOWNLOAD: "1"
      - run: pnpm typecheck
        if: matrix.suite == 'typecheck and build'
      - run: pnpm build
        if: matrix.suite == 'typecheck and build'
      # Imports every released package export and enforces the server/ import boundary.
      - name: Import public packages
        if: matrix.suite == 'typecheck and build'
        run: node scripts/check-package-imports.mjs
      # The public packages promise engines >=20 while the repo builds on Node 24.
      # Reuse this job's install and build, then test the built packages on each
      # older supported Node (no extra checkout, install or build).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: matrix.suite == 'typecheck and build'
        with:
          node-version: '20'
          package-manager-cache: false
      - name: Test and import public packages on Node 20
        if: matrix.suite == 'typecheck and build'
        run: |
          node --version
          (cd packages/sdk && node ../../scripts/node-test.mjs test/*.test.mjs)
          (cd packages/cli && node ../../scripts/node-test.mjs test/*.test.mjs)
          (cd packages/contrib-astro && node ../../scripts/node-test.mjs index-docs.test.mjs)
          (cd packages/contrib-search-compat && node ../../scripts/node-test.mjs test/*.test.mjs)
          node scripts/check-package-imports.mjs
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: matrix.suite == 'typecheck and build'
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Test and import public packages on Node 22
        if: matrix.suite == 'typecheck and build'
        run: |
          node --version
          (cd packages/sdk && node ../../scripts/node-test.mjs test/*.test.mjs)
          (cd packages/cli && node ../../scripts/node-test.mjs test/*.test.mjs)
          (cd packages/contrib-astro && node ../../scripts/node-test.mjs index-docs.test.mjs)
          (cd packages/contrib-search-compat && node ../../scripts/node-test.mjs test/*.test.mjs)
          node scripts/check-package-imports.mjs

  # Real-Postgres and Redis tests (locks, concurrency, billing, OAuth) skip without
  # their URLs, so run them here against service containers, one fresh copy of a
  # migrated template database per file. The runner fails on skipped tests too.
  database:
    name: database integration
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-bookworm@sha256:839fbb5a4942a7758dd93e18b42ea5649807491a0545b5eeeb8f0b8bb11857a5
        env:
          POSTGRES_USER: docslurp
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: tmpl
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U docslurp" --health-interval 2s --health-timeout 5s --health-retries 30
      redis:
        image: redis:7.4-alpine@sha256:6ba19c50b56777f5c11c58eff8ddb69d0d5f27ba131cffb63f180ccfd43c66af
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      DATABASE_TEST_ADMIN_URL: postgres://docslurp:ci-only-password@127.0.0.1:5432
      DATABASE_TEST_TEMPLATE: tmpl
      REDIS_TEST_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @docslurp/shared build
      - name: Migrate the template database
        run: DATABASE_URL="${DATABASE_TEST_ADMIN_URL}/${DATABASE_TEST_TEMPLATE}" node server/db/migrate.mjs
      - name: Run gated database and Redis tests
        run: node scripts/run-database-tests.mjs

  ci-success:
    # A stable required check. Never mask failures.
    needs: [test, database]
    if: always()
    runs-on: ubuntu-slim
    timeout-minutes: 1
    steps:
      - name: Require every gate
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          node -e 'const jobs = JSON.parse(process.env.RESULTS); if (Object.values(jobs).some(job => job.result !== "success")) process.exit(1)'
