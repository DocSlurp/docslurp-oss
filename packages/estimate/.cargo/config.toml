# lopdf pulls in getrandom (PDF encryption) through rand; the estimator never encrypts, and wasm32-unknown-unknown
# has no entropy source without JS glue, so select getrandom's "unsupported" backend for the plain-ABI build.
[target.wasm32-unknown-unknown]
# The module may grow to 512 MiB at most: a hostile file traps (and the host recreates the instance) instead of
# exhausting the host's memory.
rustflags = ["--cfg", 'getrandom_backend="unsupported"', "-C", "link-arg=--max-memory=536870912"]
