# lopdf pulls in getrandom (PDF encryption) through rand; the estimator never encrypts, and wasm32-unknown-unknown
# has no entropy source without JS glue, so select getrandom's "unsupported" backend for the plain-ABI build.
#
# Memory is imported (env.memory), not defined: each host keeps one memory of at most 256 MiB at a time and, after a
# trap, drops it for a fresh one (a memory cannot shrink, and a new instance's allocator only uses pages it grows
# itself, so reusing a memory a file grew to its maximum would starve every later file).
[target.wasm32-unknown-unknown]
rustflags = [
  "--cfg", 'getrandom_backend="unsupported"',
  "-C", "link-arg=--import-memory",
  "-C", "link-arg=--initial-memory=16777216",
  "-C", "link-arg=--max-memory=268435456",
]
